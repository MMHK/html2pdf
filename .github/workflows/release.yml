# .github/workflows/release.yml

name: GoReleaser

# 工作流程的觸發條件
on:
  push:
    # 只有當一個以 'v' 開頭的 tag 被推送到倉庫時，才觸發此流程
    # 例如：v1.0.0, v1.2.3-beta
    tags:
      - 'v*'

# 權限設置，允許工作流程創建 GitHub Release
permissions:
  contents: write

jobs:
  html2pdf-release:
    runs-on: ubuntu-latest
    steps:
      # 第一步：檢出你的代碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：登錄 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 第三步：設置 Docker Buildx
      - name: Set up Docker Buildx  # 支援多平台建置
        uses: docker/setup-buildx-action@v3

      # 第四步：建置並推送 Docker 鏡像
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .  # 建置上下文（包含Dockerfile的目錄）
          push: true  # 推送至Docker Hub
          platforms: linux/amd64,linux/arm64  # 只構建 amd64 和 arm64 架構
          tags: ${{ secrets.DOCKERHUB_TEAM }}/html2pdf:chromedp
          cache-from: type=gha  # 使用GitHub Actions快取加速建置
          cache-to: type=gha,mode=max