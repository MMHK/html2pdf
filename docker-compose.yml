version: "3.8"

services:
  html2pdf:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - "linux/amd64"
    image: mmhk/html2pdf:latest

  app:
    image: mmhk/html2pdf
    restart: always
    environment:
      - HOST=0.0.0.0:4444
      - ROOT=/app/web_root
      - TIMEOUT=60
      - WORKER=4
      - TLL=3600
      - LOG_LEVEL=INFO
      - TZ=Asia/Hong_Kong
    ports:
      - 4444:4444